<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191a1c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Heating</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1f21; --muted: #666a70;
    --line: #dddcd7; --button: #eceae5; --accent: #b4490f; --error: #a4161a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191a1c; --card: #24262a; --text: #eeeeec; --muted: #a2a6ac;
      --line: #383a3f; --button: #33363b; --accent: #f08a4b; --error: #ff8a8a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; max-width: 480px;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 1.25rem; margin: 4px 0 16px; }
  .room {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 12px;
  }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  h2 { font-size: 1.05rem; margin: 0; }
  .now { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .state { color: var(--muted); font-size: .9rem; min-height: 1.3em; margin-top: 2px; }
  .state.heating { color: var(--accent); }
  .target { display: grid; grid-template-columns: repeat(2, 1fr) 1.4fr repeat(2, 1fr); gap: 6px; align-items: center; margin-top: 12px; }
  .value { text-align: center; font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  button {
    min-height: 48px; border: 0; border-radius: 10px; background: var(--button); color: var(--text);
    font: inherit; font-variant-numeric: tabular-nums; touch-action: manipulation; cursor: pointer;
  }
  button:active { filter: brightness(.9); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #error { color: var(--error); min-height: 1.4em; margin: 0; }
</style>
</head>
<body>
<h1>Heating</h1>
<div id="rooms"></div>
<p id="error" role="status"></p>
<script>
  const roomsEl = document.getElementById('rooms');
  const errorEl = document.getElementById('error');
  const steps = [-1, -0.5, 0.5, 1];
  let data = null;

  const degrees = v => v == null ? '–' : v.toFixed(1) + ' °C';
  const signed = s => (s > 0 ? '+' : '−') + Math.abs(s);

  function describe(room) {
    if (room.mode === '') return 'Waiting for the thermostat';
    if (room.mode === 'off') return 'Not heating: the thermostat is off';
    return room.heating ? 'Heating' : 'Not heating right now';
  }

  function button(room, step) {
    const b = document.createElement('button');
    b.textContent = signed(step);
    b.setAttribute('aria-label', room.label + ' target ' + signed(step) + ' degrees');
    const next = room.target == null ? null : room.target + step;
    b.disabled = next == null || next < data.minTarget || next > data.maxTarget;
    b.addEventListener('click', () => setTarget(room.id, next));
    return b;
  }

  function render() {
    roomsEl.replaceChildren(...data.rooms.map(room => {
      const card = document.createElement('section');
      card.className = 'room';

      const head = document.createElement('div');
      head.className = 'head';
      const name = document.createElement('h2');
      name.textContent = room.label;
      const now = document.createElement('span');
      now.className = 'now';
      now.textContent = degrees(room.temperature);
      head.append(name, now);

      const state = document.createElement('div');
      state.className = 'state' + (room.heating ? ' heating' : '');
      state.textContent = describe(room);

      const target = document.createElement('div');
      target.className = 'target';
      const value = document.createElement('div');
      value.className = 'value';
      value.textContent = room.target == null ? '–' : room.target.toFixed(1);
      value.setAttribute('aria-label', 'Target ' + degrees(room.target));
      target.append(button(room, steps[0]), button(room, steps[1]), value, button(room, steps[2]), button(room, steps[3]));

      card.append(head, state, target);
      return card;
    }));
  }

  async function refresh() {
    try {
      const res = await fetch('api/rooms');
      if (!res.ok) throw new Error(res.statusText);
      data = await res.json();
      render();
      errorEl.textContent = '';
    } catch {
      errorEl.textContent = 'Can\'t reach the server. Are you on the home Wi-Fi?';
    }
  }

  async function setTarget(id, target) {
    try {
      const res = await fetch('api/rooms/' + encodeURIComponent(id) + '/target', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target }),
      });
      if (!res.ok) throw new Error(await res.text());
      errorEl.textContent = '';
    } catch (e) {
      errorEl.textContent = 'Not changed: ' + e.message;
    }
    refresh();
  }

  refresh();
  setInterval(refresh, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191a1c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Heating</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1f21; --muted: #666a70;
    --line: #dddcd7; --button: #eceae5; --accent: #b4490f; --error: #a4161a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191a1c; --card: #24262a; --text: #eeeeec; --muted: #a2a6ac;
      --line: #383a3f; --button: #33363b; --accent: #f08a4b; --error: #ff8a8a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; max-width: 480px;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 1.25rem; margin: 4px 0 16px; }
  .room {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 12px;
  }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  h2 { font-size: 1.05rem; margin: 0; }
  .now { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .state { color: var(--muted); font-size: .9rem; min-height: 1.3em; margin-top: 2px; }
  .state.heating { color: var(--accent); }
  .target { display: grid; grid-template-columns: repeat(2, 1fr) 1.4fr repeat(2, 1fr); gap: 6px; align-items: center; margin-top: 12px; }
  .value { text-align: center; font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  button {
    min-height: 48px; border: 0; border-radius: 10px; background: var(--button); color: var(--text);
    font: inherit; font-variant-numeric: tabular-nums; touch-action: manipulation; cursor: pointer;
  }
  button:active { filter: brightness(.9); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #error { color: var(--error); min-height: 1.4em; margin: 0; }
  .note { color: var(--muted); font-size: .9rem; margin-top: 8px; }
  .note:empty { display: none; }
  .note.problem { color: var(--error); }
  .airing { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .airing button.stop { grid-column: 1 / -1; background: var(--accent); color: var(--card); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Heating</h1>
<div id="rooms"></div>
<p id="error" role="status"></p>
<script>
  const roomsEl = document.getElementById('rooms');
  const errorEl = document.getElementById('error');
  const steps = [-1, -0.5, 0.5, 1];
  const cards = new Map();
  let data = null;
  // Commands go out one at a time, and while any is on its way a refresh could
  // show a value from before it, so refreshes that overlap one are ignored.
  let sending = 0;
  let sendQueue = Promise.resolve();
  let refreshGeneration = 0;
  // Kept apart, so a good refresh doesn't wipe the reason a command failed.
  let commandError = '';
  let connectionError = '';

  function showError() {
    errorEl.textContent = commandError || connectionError;
  }

  const airingMinutes = [15, 30, 60];

  const clock = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const degrees = v => v == null ? '–' : v.toFixed(1) + ' °C';
  const signed = s => (s > 0 ? '+' : '−') + Math.abs(s);
  const inRange = v => v >= data.minTarget && v <= data.maxTarget;

  function describe(room) {
    switch (room.airingState) {
      case 'starting': return 'Airing: turning the heating off';
      case 'active': return 'Airing until ' + clock(room.airingUntil) + ', not heating';
      case 'restoring': return 'Airing is over: turning the heating back on';
    }
    if (room.mode === 'unknown') return 'Waiting for the thermostat';
    if (room.mode === 'off') return 'Not heating: the thermostat is off';
    return room.heating ? 'Heating' : 'Not heating right now';
  }

  function note(room) {
    if (room.commandFailed) return { text: 'The thermostat isn\'t confirming. Still trying.', problem: true };
    if (room.targetState === 'failed') return { text: 'The thermostat didn\'t take the last change.', problem: true };
    if (room.targetState === 'held') return { text: 'Target applies when heating is back.', problem: false };
    if (room.targetState === 'sending') return { text: 'Sending the target…', problem: false };
    const lastSeen = room.lastSeen ? Date.now() - new Date(room.lastSeen) : 0;
    if (lastSeen > 2 * 3600 * 1000) return { text: 'Last report at ' + clock(room.lastSeen) + '.', problem: true };
    return { text: '', problem: false };
  }

  function makeButton(id, label, step) {
    const b = document.createElement('button');
    b.textContent = signed(step);
    b.setAttribute('aria-label', label + ' target ' + signed(step) + ' degrees');
    // Worked out at the tap, so quick taps add up.
    b.addEventListener('click', () => tap(id, step));
    return { el: b, step };
  }

  function makeCard(room) {
    const el = document.createElement('section');
    el.className = 'room';

    const head = document.createElement('div');
    head.className = 'head';
    const name = document.createElement('h2');
    name.textContent = room.label;
    const now = document.createElement('span');
    now.className = 'now';
    head.append(name, now);

    const state = document.createElement('div');

    const target = document.createElement('div');
    target.className = 'target';
    const value = document.createElement('div');
    value.className = 'value';
    const buttons = steps.map(step => makeButton(room.id, room.label, step));
    target.append(buttons[0].el, buttons[1].el, value, buttons[2].el, buttons[3].el);

    const airing = document.createElement('div');
    airing.className = 'airing';
    const start = airingMinutes.map(minutes => {
      const b = document.createElement('button');
      b.textContent = 'Airing ' + minutes;
      b.setAttribute('aria-label', 'Air ' + room.label + ' for ' + minutes + ' minutes');
      b.addEventListener('click', () => startAiring(room.id, minutes));
      airing.append(b);
      return b;
    });
    const stop = document.createElement('button');
    stop.className = 'stop';
    stop.textContent = 'Heat again';
    stop.addEventListener('click', () => stopAiring(room.id));
    airing.append(stop);

    const problem = document.createElement('div');

    el.append(head, state, target, airing, problem);
    roomsEl.append(el);
    return { now, state, value, buttons, start, stop, problem };
  }

  // Updates the existing elements: replacing a button during a tap loses the tap.
  function render() {
    for (const room of data.rooms) {
      if (!cards.has(room.id)) cards.set(room.id, makeCard(room));
      const card = cards.get(room.id);
      card.now.textContent = degrees(room.temperature);
      card.state.className = 'state' + (room.heating ? ' heating' : '');
      card.state.textContent = describe(room);
      card.value.textContent = room.target == null ? '–' : room.target.toFixed(1);
      card.value.setAttribute('aria-label', 'Target ' + degrees(room.target));
      for (const b of card.buttons) {
        b.el.disabled = room.target == null || !inRange(room.target + b.step);
      }
      const airing = room.airingState === 'starting' || room.airingState === 'active';
      const offAlone = room.airingState === 'none' && room.mode === 'off';
      for (const b of card.start) b.hidden = airing;
      card.stop.hidden = !airing && !offAlone;
      const n = note(room);
      card.problem.className = 'note' + (n.problem ? ' problem' : '');
      card.problem.textContent = n.text;
    }
  }

  async function refresh() {
    const generation = ++refreshGeneration;
    try {
      const res = await fetch('api/rooms');
      if (!res.ok) throw new Error(res.statusText);
      const next = await res.json();
      if (sending > 0 || generation !== refreshGeneration) return;
      data = next;
      render();
      connectionError = data.connected ? '' : 'No connection to the broker: values may be old and commands wait.';
    } catch {
      if (generation !== refreshGeneration) return;
      connectionError = 'Can\'t reach the server. Are you on the home Wi-Fi?';
    }
    showError();
  }

  function tap(id, step) {
    const room = data.rooms.find(r => r.id === id);
    if (room.target == null || !inRange(room.target + step)) return;
    room.target += step;
    render();

    const target = room.target;
    enqueue('api/rooms/' + encodeURIComponent(id) + '/target', 'POST', { target });
  }

  function startAiring(id, minutes) {
    const room = data.rooms.find(r => r.id === id);
    room.airingState = 'starting';
    room.airingUntil = new Date(Date.now() + minutes * 60000).toISOString();
    render();
    enqueue('api/rooms/' + encodeURIComponent(id) + '/airing', 'POST', { minutes });
  }

  function stopAiring(id) {
    const room = data.rooms.find(r => r.id === id);
    room.airingState = 'restoring';
    render();
    enqueue('api/rooms/' + encodeURIComponent(id) + '/airing', 'DELETE');
  }

  function enqueue(url, method, body) {
    sending++;
    sendQueue = sendQueue.then(() => send(url, method, body)).finally(() => {
      sending--;
      if (sending === 0) refresh();
    });
  }

  async function errorMessage(res) {
    try {
      return (await res.json()).message;
    } catch {
      return res.statusText || 'error ' + res.status;
    }
  }

  async function send(url, method, body) {
    try {
      const options = { method };
      if (body) {
        options.headers = { 'Content-Type': 'application/json' };
        options.body = JSON.stringify(body);
      }
      const res = await fetch(url, options);
      if (!res.ok) throw new Error(await errorMessage(res));
      commandError = '';
    } catch (e) {
      commandError = 'Not changed: ' + e.message;
    }
    showError();
  }

  refresh();
  setInterval(refresh, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>

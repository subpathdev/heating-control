openapi: 3.0.3
info:
  title: heating-control
  description: >-
    The contract between the heating-control backend and its page. Go types and
    the server interface are generated from this file, so change it first and
    run `go generate ./...`.
  version: 0.2.0
paths:
  /api/rooms:
    get:
      operationId: listRooms
      summary: List the rooms and the allowed target range.
      responses:
        "200":
          description: The configured rooms, in configured order.
          headers:
            Cache-Control:
              description: Always no-store, so the page never shows old values.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomList"
        "403":
          description: The request came from another website, or by an unknown host name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server failed to write the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/rooms/{id}/target:
    post:
      operationId: setRoomTarget
      summary: Change a room's target temperature.
      description: >-
        The target is rounded to 0.5 °C. A 202 means the target was accepted, not
        that it has arrived: follow targetState in the room list. It's held while
        the room is airing or the thermostat is off or hasn't reported, because
        writing a setpoint would switch a thermostat that is off back on.
      parameters:
        - name: id
          in: path
          required: true
          description: The room's id from the room list.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTargetRequest"
      responses:
        "202":
          description: The target was accepted.
        "400":
          description: The body is invalid or the target is outside the allowed range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The request came from another website, or by an unknown host name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The room doesn't exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server failed to write the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/rooms/{id}/airing:
    post:
      operationId: startRoomAiring
      summary: Stop heating a room because a window is open.
      description: >-
        When the time is up, heating comes back with the mode and target from
        before airing. Calling this again during airing sets a new end time. A 202
        means airing was accepted: follow airingState in the room list.
      parameters:
        - name: id
          in: path
          required: true
          description: The room's id from the room list.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAiringRequest"
      responses:
        "202":
          description: Airing was accepted.
        "400":
          description: The body is invalid or minutes isn't one of the allowed values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The request came from another website, or by an unknown host name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The room doesn't exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server failed to write the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: stopRoomAiring
      summary: End airing now and heat again.
      description: >-
        If the room isn't airing but its thermostat is off, this turns it back on
        with its last mode and target. Otherwise it does nothing.
      parameters:
        - name: id
          in: path
          required: true
          description: The room's id from the room list.
          schema:
            type: string
      responses:
        "202":
          description: Accepted.
        "403":
          description: The request came from another website, or by an unknown host name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The room doesn't exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server failed to write the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    RoomList:
      type: object
      required: [rooms, connected, minTarget, maxTarget]
      properties:
        connected:
          type: boolean
          description: >-
            Whether the backend is connected to the broker. While it isn't, nothing
            can be sent and the rooms' values may be out of date.
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/Room"
        minTarget:
          type: number
          format: double
          description: The lowest target allowed, in °C.
        maxTarget:
          type: number
          format: double
          description: The highest target allowed, in °C.
    Room:
      type: object
      required: [id, label, temperature, target, targetState, mode, heating, airingState, airingUntil, lastSeen, commandFailed]
      properties:
        id:
          type: string
        label:
          type: string
        temperature:
          type: number
          format: double
          nullable: true
          description: The room's temperature in °C, or null until it has been reported.
        target:
          type: number
          format: double
          nullable: true
          description: The chosen target in °C, or null until it is known.
        mode:
          $ref: "#/components/schemas/Mode"
        heating:
          type: boolean
          description: Whether the thermostat is calling for heat right now.
        targetState:
          $ref: "#/components/schemas/TargetState"
        airingState:
          $ref: "#/components/schemas/AiringState"
        airingUntil:
          type: string
          format: date-time
          nullable: true
          description: When airing ends and heating comes back, or null if not airing.
        lastSeen:
          type: string
          format: date-time
          nullable: true
          description: When the thermostat last reported, or null if not since the backend started.
        commandFailed:
          type: boolean
          description: >-
            Whether the thermostat hasn't confirmed a command to turn off or heat
            again. The backend keeps trying, more slowly.
    Mode:
      type: string
      enum: [unknown, "off", auto, heat]
      description: The thermostat's mode. unknown means it hasn't reported yet.
    TargetState:
      type: string
      enum: [applied, sending, held, failed]
      description: >-
        applied means the thermostat confirmed the target. sending means it's on
        its way. held means it waits until the thermostat can take it. failed means
        the thermostat never confirmed the last change, so target shows what it
        reports instead.
    AiringState:
      type: string
      enum: [none, starting, active, restoring]
      description: >-
        none means not airing. starting means airing was accepted and the thermostat
        hasn't confirmed it's off. active means it's off. restoring means airing has
        ended and the thermostat hasn't confirmed it's heating again.
    StartAiringRequest:
      type: object
      required: [minutes]
      properties:
        minutes:
          type: integer
          enum: [15, 30, 60]
          description: How long to air the room.
    SetTargetRequest:
      type: object
      required: [target]
      properties:
        target:
          type: number
          format: double
          description: The new target in °C, within minTarget and maxTarget.
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

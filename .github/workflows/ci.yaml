# Tests and lints every PR and push to main. A push to main also releases: svu
# works out the next version from the conventional commits since the last tag,
# and if there is one, the image and Helm chart are published and the tag and
# release created.
# feat: is a minor bump, fix: a patch, and docs:, ci:, chore: and the like don't
# release. While the version is 0.x, a breaking change is a minor bump too.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: 44.253.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Check the generated API code matches openapi.yaml
        run: |
          go generate ./...
          git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.3.2
      - run: helm lint charts/heating-control -f charts/heating-control/ci-values.yaml
      - run: helm template test charts/heating-control -f charts/heating-control/ci-values.yaml

  # --strict also fails when Renovate would want to migrate the config.
  renovate-config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict

  # Builds without pushing, so a broken Dockerfile shows up in the PR.
  image:
    if: github.event_name == 'pull_request'
    needs: [test, lint, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false

  release:
    if: github.event_name == 'push'
    needs: [test, lint, chart]
    runs-on: ubuntu-latest
    # Two quick merges must not work out the same version.
    concurrency: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # svu needs the commits and tags since the last release.
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Work out the next version
        id: next
        run: |
          go install github.com/caarlos0/svu/v3@v3.4.1
          tag="$("$(go env GOPATH)/bin/svu" next)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Nothing to release, still at $tag."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: steps.next.outputs.tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image goes first: if it fails there's no tag, and the next push retries.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: steps.next.outputs.tag != ''
        with:
          context: .
          push: true
          tags: ghcr.io/subpathdev/heating-control:${{ steps.next.outputs.version }}
          build-args: VERSION=${{ steps.next.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/subpathdev/heating-control
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        if: steps.next.outputs.tag != ''
        with:
          version: v4.3.2
      - name: Publish the chart
        if: steps.next.outputs.tag != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package charts/heating-control --version "$VERSION" --app-version "$VERSION"
          helm push "heating-control-$VERSION.tgz" oci://ghcr.io/subpathdev/charts
      - name: Create the release
        if: steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
